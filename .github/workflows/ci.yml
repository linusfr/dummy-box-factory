name: ci

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint
        run: nix develop --command just pre-commit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # check-stls-current rebuilds and diffs; `build` compares geometry rather
      # than bytes, so a reordered-but-identical export doesn't fail the job
      - name: Verify the emblems and the committed plates
        run: |
          nix develop --command just check-emblems
          nix develop --command just check-emblems-current
          nix develop --command just check-stls-current

      - uses: actions/upload-artifact@v4
        with:
          name: deckbox-stls
          path: files/deckbox_*.stl

  release:
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install semantic-release
        env:
          # renovate: datasource=github-releases depName=go-semantic-release/semantic-release
          SEMREL_VERSION: "v2.31.0"
        run: |
          curl -fsSL -o /usr/local/bin/semantic-release \
            "https://github.com/go-semantic-release/semantic-release/releases/download/${SEMREL_VERSION}/semantic-release_${SEMREL_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/semantic-release

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPTS=(
            --provider-opt log_order=ctime
            --provider-opt strip_v_tag_prefix=true
            --commit-analyzer-opt "patch_release_rules=fix,chore(deps)"
          )

          # 1. Compute the next version. Empty => nothing releasable, stop.
          DRY=$(semantic-release --dry "${OPTS[@]}" 2>&1 || true)
          echo "$DRY"
          VERSION=$(echo "$DRY" | grep -oiP '(?<=new version: )\d+\.\d+\.\d+' || true)
          if [ -z "$VERSION" ]; then echo "no release"; exit 0; fi

          # 2. Idempotent: a re-run must not try to cut the same release twice.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"; exit 0
          fi

          # 3. Rebuild the plates so the release assets match the tagged tree.
          nix develop --command just build

          # 4. Cut the release with the STLs attached, so people can download a
          #    printable plate without cloning or installing OpenSCAD.
          gh release create "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --generate-notes \
            files/deckbox_*.stl
