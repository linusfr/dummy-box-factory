name: ci

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint
        run: nix develop --command just pre-commit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # check-stls-current rebuilds and diffs; `build` compares geometry rather
      # than bytes, so a reordered-but-identical export doesn't fail the job
      - name: Verify the emblems and the committed plates
        run: |
          nix develop --command just check-emblems
          nix develop --command just check-emblems-current
          nix develop --command just check-stls-current

      - uses: actions/upload-artifact@v4
        with:
          name: deckbox-stls
          path: files/deckbox_*.stl

  release:
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # using the action rather than a pinned binary download means Dependabot
      # keeps it current along with the other actions
      - name: Work out the next version
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry: true
          allow-initial-development-versions: true
          custom-arguments: >-
            --provider-opt log_order=ctime
            --provider-opt strip_v_tag_prefix=true
            --commit-analyzer-opt patch_release_rules=fix,chore(deps)

      - name: Release
        if: steps.semrel.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          set -euo pipefail

          # idempotent: a re-run must not try to cut the same release twice
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"; exit 0
          fi

          # rebuild the plates so the release assets match the tagged tree
          nix develop --command just build

          # attach the STLs so people can download a printable plate without
          # cloning or installing OpenSCAD
          gh release create "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --generate-notes \
            files/deckbox_*.stl
